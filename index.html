<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Saya</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #4e73df, #1cc88a);
      color: white;
      text-align: center;
    }

    header {
      padding: 60px 20px;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      background: white;
      color: #4e73df;
      text-decoration: none;
      border-radius: 25px;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn:hover {
      background: #f8f9fc;
      transform: scale(1.05);
    }

    footer {
      margin-top: 100px;
      padding: 20px;
      background: rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <header>
    <h1>Halo 👋</h1>
    <p>Ini website pertama saya yang dibuat dari HP dan diupload ke GitHub.</p>
    <a href="#" class="btn">Klik Saya</a>
  </header>

  <footer>
    <p>© 2026 Website Saya</p>
  </footer>

</body>
</html>
